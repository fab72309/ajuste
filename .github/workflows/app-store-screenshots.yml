name: AJUSTE App Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Capture French iPhone screenshots
        shell: bash
        run: |
          set -euo pipefail

          runtime_id="$(
            xcrun simctl list runtimes --json |
              jq -r '
                .runtimes
                | map(select(.platform == "iOS" and .isAvailable == true))
                | sort_by(.version | split(".") | map(tonumber))
                | last
                | .identifier
              '
          )"
          if [[ -z "$runtime_id" || "$runtime_id" == "null" ]]; then
            echo "No available iOS simulator runtime"
            exit 1
          fi

          device_id="$(
            xcrun simctl create \
              "AJUSTE App Store" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" \
              "$runtime_id"
          )"

          cleanup() {
            xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$device_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b

          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/BioTrackDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          app_path="$RUNNER_TEMP/BioTrackDerivedData/Build/Products/Debug-iphonesimulator/BioTrack.app"
          test -d "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl status_bar "$device_id" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4

          mkdir -p AppStoreScreenshots/fr-FR
          capture_tab() {
            local tab="$1"
            local filename="$2"
            local settle_time="$3"

            xcrun simctl terminate "$device_id" com.fabienlopes.biotrack \
              >/dev/null 2>&1 || true
            xcrun simctl launch "$device_id" com.fabienlopes.biotrack \
              -appStoreScreenshots \
              -hasCompletedInitialOnboarding YES \
              -selectedTab "$tab" \
              -AppleLanguages "(fr)" \
              -AppleLocale "fr_FR"
            sleep "$settle_time"
            xcrun simctl io "$device_id" screenshot --type=jpeg \
              "AppStoreScreenshots/fr-FR/$filename"
          }

          # Relaunching with the requested tab avoids the system confirmation
          # sheet shown by simctl openurl for custom URL schemes.
          capture_tab 0 "01-checklist.jpg" 4
          capture_tab 1 "02-suivi.jpg" 3
          capture_tab 2 "03-statistiques.jpg" 4
          capture_tab 3 "04-protocoles.jpg" 3

          for image in AppStoreScreenshots/fr-FR/*.jpg; do
            dimensions="$(sips -g pixelWidth -g pixelHeight "$image")"
            grep -q "pixelWidth: 1320" <<<"$dimensions"
            grep -q "pixelHeight: 2868" <<<"$dimensions"
            if sips -g hasAlpha "$image" | grep -q "hasAlpha: yes"; then
              echo "Screenshot contains an alpha channel: $image"
              exit 1
            fi
          done

          unique_count="$(
            shasum -a 256 AppStoreScreenshots/fr-FR/*.jpg |
              awk '{print $1}' |
              sort -u |
              wc -l |
              tr -d ' '
          )"
          if [[ "$unique_count" -ne 4 ]]; then
            echo "Expected four distinct screenshots, found $unique_count"
            exit 1
          fi

      - name: Upload App Store screenshots
        uses: actions/upload-artifact@v7
        with:
          name: ajuste-app-store-screenshots-fr
          path: AppStoreScreenshots/fr-FR
          if-no-files-found: error
