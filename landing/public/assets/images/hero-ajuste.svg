<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">AJUSTE, un changement à la fois</title>
  <desc id="desc">Deux trajectoires se décalent vers le haut, entourées de cartes de routines et de tendances.</desc>
  <rect width="720" height="420" rx="28" fill="#F7F4EE"/>
  <circle cx="580" cy="90" r="110" fill="#FFE1DA"/>
  <circle cx="130" cy="350" r="120" fill="#E8EDF0"/>
  <g transform="translate(100 48) scale(.8)">
    <path d="M74 196h128c36 0 47-64 91-64h115" fill="none" stroke="#172B3A" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M74 316h128c36 0 47-64 91-64h76" fill="none" stroke="#FF6B57" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="423" cy="252" r="21" fill="#FF6B57"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="430" y="248" width="210" height="94" rx="18" fill="#FFFFFF" stroke="#D8D0C7"/>
    <text x="452" y="278" fill="#55636D" font-size="13" font-weight="700" letter-spacing="1.5">SIGNAL DE LA SEMAINE</text>
    <text x="452" y="309" fill="#172B3A" font-size="24" font-weight="700">Énergie plus stable</text>
    <circle cx="612" cy="303" r="10" fill="#FF6B57"/>
    <rect x="52" y="70" width="180" height="76" rx="16" fill="#FFFFFF" stroke="#D8D0C7"/>
    <text x="74" y="100" fill="#55636D" font-size="13" font-weight="700" letter-spacing="1.5">AJUSTEMENT</text>
    <text x="74" y="127" fill="#172B3A" font-size="20" font-weight="700">Écran coupé à 22 h</text>
  </g>
</svg>
